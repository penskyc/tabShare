<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>Share your screen</title>
    <style>
      :root { color-scheme: dark; --bg: #0e0e13; --panel: #1b1b25; --line: #2a2a38; --text: #ecebf3; --muted: #8d8ba3; --accent: #ff7a3d; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, 'Segoe UI', sans-serif; display: flex; flex-direction: column; height: 100vh; }
      header { padding: 16px 20px 6px; }
      h1 { margin: 0; font-size: 18px; }
      header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
      main { flex: 1; overflow-y: auto; padding: 8px 20px 12px; }
      h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 14px 0 8px; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
      button.src { all: unset; cursor: pointer; display: grid; gap: 6px; padding: 8px; border-radius: 10px; border: 2px solid transparent; background: var(--panel); }
      button.src:hover { border-color: var(--line); }
      button.src[aria-pressed='true'] { border-color: var(--accent); }
      button.src:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      button.src img { width: 100%; aspect-ratio: 16 / 9; object-fit: contain; background: #000; border-radius: 6px; }
      button.src span { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      footer { display: flex; justify-content: flex-end; gap: 10px; padding: 12px 20px; border-top: 1px solid var(--line); }
      footer button { font: inherit; padding: 8px 18px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--text); cursor: pointer; }
      footer button.primary { background: var(--accent); border-color: var(--accent); color: #1a0d05; font-weight: 600; }
      footer button:disabled { opacity: 0.4; cursor: default; }
    </style>
  </head>
  <body>
    <header>
      <h1>Share your screen</h1>
      <p>Pick a whole screen or a single window. Double-click to share right away.</p>
    </header>
    <main>
      <h2>Screens</h2>
      <div class="grid" id="screens"></div>
      <h2>Windows</h2>
      <div class="grid" id="windows"></div>
    </main>
    <footer>
      <button id="cancel">Cancel</button>
      <button id="share" class="primary" disabled>Share</button>
    </footer>
    <script>
      let chosen = null;
      const share = document.getElementById('share');
      const pick = (id) => {
        chosen = id;
        share.disabled = !id;
        document.querySelectorAll('button.src').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.id === id)));
      };
      share.onclick = () => chosen && window.picker.choose(chosen);
      document.getElementById('cancel').onclick = () => window.picker.choose(null);
      addEventListener('keydown', (e) => {
        if (e.key === 'Escape') window.picker.choose(null);
        if (e.key === 'Enter' && chosen) window.picker.choose(chosen);
      });
      window.picker.onSources((sources) => {
        for (const s of sources) {
          const b = document.createElement('button');
          b.className = 'src';
          b.dataset.id = s.id;
          b.setAttribute('aria-pressed', 'false');
          b.title = s.name;
          const img = document.createElement('img');
          img.src = s.thumb;
          img.alt = '';
          const label = document.createElement('span');
          label.textContent = s.name;
          b.append(img, label);
          b.onclick = () => pick(s.id);
          b.ondblclick = () => window.picker.choose(s.id);
          document.getElementById(s.screen ? 'screens' : 'windows').append(b);
        }
        const first = sources.find((s) => s.screen);
        if (first) pick(first.id);
        document.querySelector('button.src')?.focus();
      });
    </script>
  </body>
</html>
